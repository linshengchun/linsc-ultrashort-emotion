name: 手动生成LINSC情绪复盘

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: 交易日（YYYY-MM-DD）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: linsc-report-${{ inputs.trade_date }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate date
        shell: bash
        run: |
          if [[ ! "${{ inputs.trade_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "trade_date must be YYYY-MM-DD"
            exit 1
          fi

      - name: Fetch objective market data
        run: node scripts/fetch-objective.mjs --date "${{ inputs.trade_date }}"

      - name: Generate static Markdown report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4' }}
        run: node scripts/generate-report.mjs --date "${{ inputs.trade_date }}"

      - name: Validate and rebuild report index
        run: npm run report:prepare

      - name: Commit report
        shell: bash
        run: |
          git config user.name "linsc-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reports public/reports lib/generated-reports.ts
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "report: add ${{ inputs.trade_date }} emotion review"
          git push
